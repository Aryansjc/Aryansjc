<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <style>
      @keyframes appear {
        0%, 100% { opacity: 0; }
        20%, 80% { opacity: 1; }
      }
      .name {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 56px;
        font-weight: bold;
        fill: #36D7B7;
        text-anchor: middle;
        dominant-baseline: central;
        animation: appear 4s ease-in-out infinite;
      }
    </style>
  </defs>
  <text x="300" y="60" class="name">Aryan Singh</text>
</svg>
